---
# Static analysis of GitHub Actions workflows using zizmor.
#
# Audits .github/ for common CI/CD security issues: credential persistence,
# template injection, overly broad permissions, and unpinned action references.
#
# See https://docs.zizmor.sh/audits/ for the audit list, and .github/zizmor.yml
# for repo-specific configuration.
#
###
name: zizmor

on:
    push:
        branches:
        -   main
        paths:
        -   .github/**
    pull_request:
        branches:
        -   '*'
        paths:
        -   .github/**
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    zizmor:
        name: zizmor
        runs-on: ubuntu-latest
        permissions:
            contents: read # needed to clone the repo
        steps:
        -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
                persist-credentials: false

        -   name: run zizmor
            uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
            with:
        # Pin the tool, not just the action: the action's `version` input defaults to
        # `latest`, so without this a new zizmor release adding an audit would turn CI
        # red on unrelated PRs. Bump deliberately.
                version: 1.30.0
                advanced-security: false
                annotations: true
                inputs: .github/
