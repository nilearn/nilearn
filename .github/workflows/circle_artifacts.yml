---
# Display a link to the circle-CI artifacts at the bottom of a pull-request.
###
name: Redirect circleci artifacts
permissions: read-all
on: [status]
jobs:
    circleci_artifacts_redirector_job:
        runs-on: ubuntu-latest
        if: "${{ github.event.context == 'ci/circleci: host_docs' }}"
        name: Run CircleCI artifacts redirector
        permissions:
            statuses: write
        steps:
        -   name: GitHub Action step
            uses: scientific-python/circleci-artifacts-redirector-action@d35a82a1e5de3864f4cf9649eb7cedcedcfe8e09 # v1.3.2
            with:
                repo-token: ${{ secrets.GITHUB_TOKEN }}
                api-token: ${{ secrets.CIRCLE_CI_TOKEN }}
                artifact-path: 0/dev/index.html
                circleci-jobs: host_docs
                job-title: Check the HTML doc here!
