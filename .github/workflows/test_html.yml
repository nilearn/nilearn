---
# Test that HTML output stay visually constant.
#
# - HTML figures and reports are generated either via
#   ``doc/visual_testing/reporter_visual_inspection_suite.py`` or
#   ``test/js/generate_html.py``
# - Javascript tests are run to open the HTML documents,
#   take a screenshot of it, and compare it to a reference screenshot
#
# Most of this is handled via tox: ``tox run -e test_html``
#
# Screenshots (reference, current and their difference) are uploaded
# at the end of the workflow.
#
###
name: test html output

on:
    push:
        branches:
        -   main
        paths:
        -   nilearn/**/*
        -   tox.ini
        -   pyproject.toml
        -   .github/workflows/test_html.yml
    pull_request:
        branches:
        -   '*'
        paths:
        -   nilearn/**/*
        -   tox.ini
        -   pyproject.toml
        -   .github/workflows/test_html.yml
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Force to use color
env:
    FORCE_COLOR: true
      # Must match the path used to restore the "Get cache from a previous
      # doc build" step below, otherwise the restored data is never found by
      # nilearn's fetchers (which default to ~/nilearn_data) and everything
      # gets re-downloaded from the network on every run regardless of
      # whether the cache was actually restored.
    NILEARN_DATA: /home/runner/work/nilearn/nilearn/nilearn_data

permissions:
    contents: read

jobs:

    test_js:

        name: Test HTML output

        runs-on: ubuntu-latest

        steps:
        -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with:
                persist-credentials: false

        -   uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
            with:
                node-version: 24

        -   name: Install the latest version of uv
            uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
            with:
                python-version: '3.11'

        -   name: Key for cache based on month number
            run: date +%m > month_num;

        -   name: Get cache from a previous doc build
            uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
            with:
                path: nilearn_data
                key: data_cache-DocumentationBuilder_month-${{ hashFiles('month_num') }}

        -   name: Install tox
            run: uv tool install tox --with=tox-uv --with=tox-gh-actions

        -   name: Run test on html output
            run: tox run -e test_html

        -   name: Upload reference, current and diff images from test
            if: success() || failure()
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            with:
                name: image
                path: tests/js/**/*.png
